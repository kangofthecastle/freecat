<svg xmlns="http://www.w3.org/2000/svg" width="420" height="160" viewBox="0 0 420 160" role="img" aria-label="A point sound source with a microphone shown at distance r and at distance 2r.">
  <rect x="0" y="0" width="420" height="160" fill="#ffffff"/>
  <!-- Source -->
  <circle cx="40" cy="80" r="10" fill="#1f2937"/>
  <text x="40" y="115" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1f2937">source</text>
  <!-- Expanding wavefronts -->
  <path d="M 56 60 A 24 24 0 0 1 56 100" fill="none" stroke="#6b7280" stroke-width="2"/>
  <path d="M 66 50 A 36 36 0 0 1 66 110" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <path d="M 78 40 A 50 50 0 0 1 78 120" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Microphone at r -->
  <rect x="196" y="70" width="14" height="20" rx="2" fill="#2563eb"/>
  <text x="203" y="115" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#2563eb">mic @ r</text>
  <!-- Microphone at 2r -->
  <rect x="376" y="70" width="14" height="20" rx="2" fill="#2563eb"/>
  <text x="383" y="115" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#2563eb">mic @ 2r</text>
  <!-- Distance brackets -->
  <line x1="40" y1="135" x2="203" y2="135" stroke="#1f2937" stroke-width="1.5"/>
  <text x="121" y="150" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1f2937">r</text>
  <line x1="40" y1="20" x2="383" y2="20" stroke="#1f2937" stroke-width="1.5"/>
  <text x="211" y="15" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1f2937">2r</text>
</svg>
