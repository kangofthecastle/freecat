name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Build · Test · Validate content
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = engines floor (lowest with node:zlib zstd); 24 = current Active LTS / dev box.
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm 11 (Node 24) can skip electron's postinstall, leaving path.txt unwritten
      # so any `import 'electron'` throws "failed to install correctly". Run it explicitly.
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate content
        run: npm run content:validate
